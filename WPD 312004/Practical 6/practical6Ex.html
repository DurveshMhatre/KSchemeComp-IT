<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 6 borders in web page and attributes</title>
</head>
<style>

    body{
        padding: 10px;
        text-align: center;
        justify-content: center;
        display:flexbox;
    }
    .border{
        padding: 10px;
        border: 10px groove darkmagenta;
    }
    p{
        padding: 10px;
    }
    h1
    {
        text-align: center;
    }
</style>
<body>
    <h1>Practical 6 Impletement border properties in web page and use different proerties with your creative</h1>
    <div class="border">
        <p style="border: 5px solid crimson;"> I am solid border</p>
        <p style="border: 5px dotted lightcoral;"> I am dotted border</p>
        <p style="border: 5px dashed darkred;"> I am dashed border</p>
    </div>
</body>
</html>
