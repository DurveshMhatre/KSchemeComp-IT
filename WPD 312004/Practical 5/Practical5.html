<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5 Text Level Tags | Text Formatting</title>
</head>
<style>
    .textFormat{
        text-align: center;
        border: 5px solid black;
        background-color: lightcoral;
        color: white;
    }
</style>
<body>
    <!-- Practical 5 Performed -->
<div class="textFormat">
    <b>I am bold</b> <br>
    <i>I am Italic</i> <br>
    <tt>I am Teletype and my font is Monospace</tt> <br>
    <u>The horizontal line will be drawn below my text</u> <br>
    <del>I am outdated information</del> <br>
    <p>a<sup>2</sup> b<sup>2</sup> = (a+b) <sup>2</sup></p> 
    H<sub>2</sub> SO <sub>4</sub> <br>
</div>
</body>
</html>
